version: '3.9'

# ─────────────────────────────────────────────────────────────────
# ALP Platform — Docker Compose Production Stack
# Built by Stan Paraclete | www.stanparaclete.com
# Usage: docker compose -f docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: alp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alp_db
      POSTGRES_USER: alp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./06-database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alp_user -d alp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alp-network

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: alp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_in_production}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alp-network

  # ─── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./05-backend
      dockerfile: Dockerfile
      target: production
    container_name: alp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://alp_user:${POSTGRES_PASSWORD}@postgres:5432/alp_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PASS: ${SMTP_PASS}
      APP_URL: ${APP_URL}
    ports:
      - "4000:4000"
    volumes:
      - ./07-assets/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - alp-network

  # ─── Web App (Next.js) ──────────────────────────────────────
  webapp:
    build:
      context: ./01-website
      dockerfile: Dockerfile
      target: production
    container_name: alp-webapp
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://backend:4000}
      NEXT_PUBLIC_APP_NAME: ALP Platform
    ports:
      - "3000:3000"
    networks:
      - alp-network

  # ─── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: alp-nginx
    restart: unless-stopped
    depends_on:
      - webapp
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./09-deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./09-deployment/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - alp-network

  # ─── Certbot (SSL) ───────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: alp-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ─── Queue Worker ────────────────────────────────────────────
  worker:
    build:
      context: ./05-backend
      dockerfile: Dockerfile
      target: production
    container_name: alp-worker
    restart: unless-stopped
    command: node src/worker.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://alp_user:${POSTGRES_PASSWORD}@postgres:5432/alp_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - alp-network

  # ─── pgAdmin (Dev only) ──────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@growwithalp.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - dev
    networks:
      - alp-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

networks:
  alp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
