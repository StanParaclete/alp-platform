<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8F16B8" />
    <meta name="robots" content="noindex" />
    <title>Connection needed | ALP</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #FAF8FC; color: #231C28; font-family: system-ui, sans-serif; }
      main { width: min(100%, 520px); margin: 0 auto; padding: 64px 24px; }
      img { display: block; width: 64px; height: 64px; border-radius: 8px; }
      .brand { margin: 20px 0 32px; font-size: 13px; color: #75687D; }
      h1 { font-size: 28px; line-height: 1.2; margin: 0 0 16px; }
      p { font-size: 16px; line-height: 1.6; margin: 0 0 24px; }
      a { display: inline-block; padding: 12px 20px; border-radius: 4px; background: #8F16B8; color: white; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #C66ADF; outline-offset: 4px; }
      a:hover { background: #71118F; }
      footer { padding: 24px; text-align: center; font-size: 14px; }
      footer a { padding: 0; background: none; color: #8F16B8; text-decoration: underline; text-underline-offset: 4px; }
      footer a:hover { background: none; color: #71118F; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="ALP" width="64" height="64" />
      <p class="brand">Accelerated Learning Plan</p>
      <h1>You're offline</h1>
      <p>Reconnect to the internet to open ALP and work on your school's learning plans.</p>
      <a href="/">Try again</a>
    </main>
    <footer>Built by <a href="https://www.stanparaclete.com/" target="_blank" rel="noopener noreferrer">Stan Paraclete</a></footer>
  </body>
</html>
